[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "magnetar-qpo"
version = "0.1.0"
description = "Torsional oscillations of a magnetar with a tangled magnetic field coupled to a magnetosphere: eigenfrequencies and residue-theorem initial value solution"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joseph Bretz" }]
dependencies = ["numpy>=1.26", "scipy>=1.15", "mpmath>=1.3", "matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/AstroJoeBretz/Magnetar-QPO-Project"
Paper = "https://doi.org/10.1093/mnras/stab1220"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "jupyter", "nbformat"]

[project.scripts]
qpo = "magnetar_qpo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/magnetar_qpo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: full-precision / full-table tests (run with -m slow)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
# `l` is the standard angular-order symbol in this physics code
ignore = ["E741"]
